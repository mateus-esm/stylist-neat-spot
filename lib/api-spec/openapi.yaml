openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /clinic/me:
    get:
      operationId: getClinicSession
      tags: [clinic]
      summary: Current clinic user and role
      responses:
        "200":
          description: Signed-in user context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicSession"
        "401":
          description: Unauthorized
  /clinic/context:
    get:
      operationId: getClinicContext
      tags: [clinic]
      summary: Current clinic membership and role
      responses:
        "200":
          description: Clinic context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicContext"
  /clinic/members:
    get:
      operationId: listClinicMembers
      tags: [clinic]
      summary: List active and revoked clinic members
      responses:
        "200":
          description: Clinic members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClinicMember"
  /clinic/members/invitations:
    post:
      operationId: inviteClinicMember
      tags: [clinic]
      summary: Invite a clinic administrator or physiotherapist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicMemberInviteInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicMemberInvitation"
  /clinic/members/invitations/{token}/accept:
    post:
      operationId: acceptClinicMemberInvitation
      tags: [clinic]
      summary: Accept a clinic invitation
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Membership activated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /clinic/members/{id}:
    patch:
      operationId: updateClinicMember
      tags: [clinic]
      summary: Change a member role or revoke access
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicMemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicMember"
  /clinic/assignments:
    get:
      operationId: listClinicAssignments
      tags: [clinic]
      summary: List patient responsibilities
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClinicAssignment"
    post:
      operationId: assignClinicPatient
      tags: [clinic]
      summary: Assign or unassign a physiotherapist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicAssignmentInput"
      responses:
        "200":
          description: Assignment saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicAssignment"
  /clinic/audit:
    get:
      operationId: listClinicAuditEvents
      tags: [clinic]
      summary: List clinic changes and clinical access events
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /clinic/portal:
    get:
      operationId: getPatientPortal
      tags: [clinic]
      summary: Authenticated patient portal data
      responses:
        "200":
          description: Portal data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientPortal"
  /clinic/portal/appointments/{id}:
    get:
      operationId: getPortalAppointment
      tags: [clinic]
      summary: Appointment detail for the patient or responsible professional
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Appointment detail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /clinic/portal/appointments/{id}/actions:
    post:
      operationId: performPortalAppointmentAction
      tags: [clinic]
      summary: Confirm, cancel, or request rescheduling
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalAppointmentActionInput"
      responses:
        "200":
          description: Idempotent action result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /clinic/appointments/{id}/transfer:
    post:
      operationId: transferClinicAppointment
      tags: [clinic]
      summary: Transfer an appointment to an active physiotherapist
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [physiotherapistUserId]
              properties:
                physiotherapistUserId: { type: string }
      responses:
        "200":
          description: Appointment transferred
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /clinic/whatsapp/consent:
    get:
      operationId: getWhatsappConsent
      tags: [clinic]
      summary: Read WhatsApp consent for a patient
      responses:
        "200":
          description: Consent state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: updateWhatsappConsent
      tags: [clinic]
      summary: Opt in or out of clinic WhatsApp messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappConsentInput"
      responses:
        "200":
          description: Consent saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /clinic/whatsapp/config:
    get:
      operationId: getWhatsappConfig
      tags: [clinic]
      summary: Read WhatsApp automation configuration and provider status
      responses:
        "200":
          description: Configuration without provider secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappConfig"
    patch:
      operationId: updateWhatsappConfig
      tags: [clinic]
      summary: Update WhatsApp automation and reminder windows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappConfigUpdate"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappSettings"
  /clinic/whatsapp/templates:
    get:
      operationId: listWhatsappTemplates
      tags: [clinic]
      summary: List clinic WhatsApp templates and allowed variables
      responses:
        "200":
          description: Templates and variables
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: createWhatsappTemplate
      tags: [clinic]
      summary: Create a WhatsApp template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappTemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappTemplate"
  /clinic/whatsapp/templates/preview:
    post:
      operationId: previewWhatsappTemplate
      tags: [clinic]
      summary: Render a safe template preview using non-clinical sample values
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappTemplatePreviewInput"
      responses:
        "200":
          description: Rendered preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappTemplatePreview"
  /clinic/whatsapp/templates/{id}:
    patch:
      operationId: updateWhatsappTemplate
      tags: [clinic]
      summary: Edit or activate a WhatsApp template
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappTemplateUpdate"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappTemplate"
    delete:
      operationId: deactivateWhatsappTemplate
      tags: [clinic]
      summary: Deactivate a WhatsApp template
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Deactivated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappTemplate"
  /clinic/whatsapp/templates/{id}/test:
    post:
      operationId: testWhatsappTemplate
      tags: [clinic]
      summary: Send a consented controlled template test
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappTemplateTestInput"
      responses:
        "200":
          description: Test delivery state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappOutbox"
  /clinic/whatsapp/outbox:
    get:
      operationId: listWhatsappOutbox
      tags: [clinic]
      summary: List WhatsApp delivery history
      responses:
        "200":
          description: Outbox messages
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
    post:
      operationId: enqueueWhatsappMessage
      tags: [clinic]
      summary: Queue a consented WhatsApp message
      requestBody:
        required: true
        content:
          application/json:
              schema:
                $ref: "#/components/schemas/WhatsappOutboxInput"
      responses:
        "201":
          description: Queued message
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /clinic/whatsapp/outbox/{id}/process:
    post:
      operationId: processWhatsappOutbox
      tags: [clinic]
      summary: Process one eligible WhatsApp outbox item
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Current delivery state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappOutbox"
  /clinic/data/{table}:
    get:
      operationId: listClinicRecords
      tags: [clinic]
      summary: List records from an authorized clinic resource
      parameters:
        - $ref: "#/components/parameters/ClinicTable"
        - name: filters
          in: query
          required: false
          schema:
            type: string
        - name: order
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicRecordList"
    post:
      operationId: createClinicRecord
      tags: [clinic]
      summary: Create an authorized clinic record
      parameters:
        - $ref: "#/components/parameters/ClinicTable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicRecordInput"
      responses:
        "201":
          description: Created record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicRecord"
  /clinic/data/{table}/{id}:
    patch:
      operationId: updateClinicRecord
      tags: [clinic]
      summary: Update an authorized clinic record
      parameters:
        - $ref: "#/components/parameters/ClinicTable"
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicRecordInput"
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicRecord"
    delete:
      operationId: deleteClinicRecord
      tags: [clinic]
      summary: Delete an authorized clinic record
      parameters:
        - $ref: "#/components/parameters/ClinicTable"
        - $ref: "#/components/parameters/RecordId"
      responses:
        "204":
          description: Deleted
  /clinic/invitations:
    post:
      operationId: inviteClinicPatient
      tags: [clinic]
      summary: Invite a patient to their clinic portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInviteInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientInvite"
  /clinic/bookings:
    post:
      operationId: createClinicBooking
      tags: [clinic]
      summary: Patient books an open availability slot (atomic)
      description: >
        Atomically creates a "solicitado" appointment for the authenticated
        patient's linked client and reserves the referenced open slot in one
        transaction. If the slot is no longer available, no appointment is
        created and a 409 is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicBookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicBooking"
        "409":
          description: Slot no longer available
  /clinic/appointments/{id}/media:
    post:
      operationId: finalizeAppointmentMedia
      tags: [clinic]
      summary: Finalize an uploaded object into appointment media
      description: >
        Consumes a DB-backed pending upload (created by
        POST /storage/uploads/request-url) and records it as session media for
        the target appointment, so subsequent GET /storage/objects requests are
        durably authorised via the session_media chain. The pending upload must
        belong to the caller, be unexpired and unconsumed, and the caller must
        be authorised for the appointment (owning admin, or the linked patient
        for their own appointment). uploaded_by is forced to the caller.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentMediaInput"
      responses:
        "200":
          description: Existing media record (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicRecord"
        "201":
          description: Media record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicRecord"
        "403":
          description: Caller not authorised for the appointment or pending upload
        "404":
          description: Appointment, object, or pending upload not found
        "409":
          description: Pending upload already finalized
        "410":
          description: Pending upload expired
components:
  parameters:
    ClinicTable:
      name: table
      in: path
      required: true
      schema:
        type: string
        enum: [appointments, availability_slots, clients, package_templates, patient_packages, services, session_exercises, session_media, session_plans, user_roles]
    RecordId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ClinicSession:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
        role:
          type: ["string", "null"]
          enum: [owner, admin, physiotherapist, patient, null]
    ClinicContext:
      type: object
      required: [clinicId, userId, role]
      properties:
        clinicId: { type: string }
        userId: { type: string }
        role: { type: string, enum: [owner, admin, physiotherapist, patient] }
        clinic: { $ref: "#/components/schemas/Clinic" }
    Clinic:
      type: object
      additionalProperties: true
    ClinicMember:
      type: object
      additionalProperties: true
    ClinicMemberInviteInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        role: { type: string, enum: [admin, physiotherapist] }
    ClinicMemberInvitation:
      type: object
      additionalProperties: true
    ClinicMemberUpdate:
      type: object
      properties:
        role: { type: string, enum: [admin, physiotherapist] }
        status: { type: string, enum: [active, revoked] }
    ClinicAssignment:
      type: object
      additionalProperties: true
    ClinicAssignmentInput:
      type: object
      required: [clientId]
      properties:
        clientId: { type: string }
        physiotherapistUserId: { type: ["string", "null"] }
    PatientPortal:
      type: object
      additionalProperties: true
    PortalAppointmentActionInput:
      type: object
      required: [action, confirmed, idempotencyKey]
      properties:
        action: { type: string, enum: [confirm_presence, request_reschedule, request_cancel] }
        confirmed: { type: boolean, enum: [true] }
        idempotencyKey: { type: string }
        requestedSlotId: { type: string }
    WhatsappConsentInput:
      type: object
      required: [optedIn]
      properties:
        clientId: { type: string }
        phone: { type: string }
        optedIn: { type: boolean }
    WhatsappOutboxInput:
      type: object
      required: [clientId, eventType, idempotencyKey]
      properties:
        clientId: { type: string }
        eventType: { type: string, enum: [invite, appointment_confirmation, appointment_reminder, reschedule] }
        idempotencyKey: { type: string }
        payload: { type: object, additionalProperties: true }
        fallbackText: { type: string }
        scheduledAt: { type: string, format: date-time }
        templateKey: { type: string }
    WhatsappConfig:
      type: object
      additionalProperties: true
    WhatsappConfigUpdate:
      type: object
      properties:
        enabled: { type: boolean }
        reminderHours:
          type: array
          items: { type: number, minimum: 1, maximum: 168 }
        timezone: { type: string }
    WhatsappSettings:
      type: object
      additionalProperties: true
    WhatsappTemplate:
      type: object
      additionalProperties: true
    WhatsappTemplateInput:
      type: object
      required: [key, eventType, label, body]
      properties:
        key: { type: string }
        eventType: { type: string, enum: [invite, appointment_confirmation, appointment_reminder, reschedule] }
        label: { type: string }
        body: { type: string }
        active: { type: boolean }
    WhatsappTemplateUpdate:
      type: object
      properties:
        key: { type: string }
        eventType: { type: string, enum: [invite, appointment_confirmation, appointment_reminder, reschedule] }
        label: { type: string }
        body: { type: string }
        active: { type: boolean }
    WhatsappTemplatePreviewInput:
      type: object
      required: [eventType, body]
      properties:
        eventType: { type: string, enum: [invite, appointment_confirmation, appointment_reminder, reschedule] }
        body: { type: string }
    WhatsappTemplatePreview:
      type: object
      required: [text]
      properties:
        text: { type: string }
    WhatsappTemplateTestInput:
      type: object
      required: [clientId]
      properties:
        clientId: { type: string }
        values: { type: object, additionalProperties: true }
    WhatsappOutbox:
      type: object
      additionalProperties: true
    ClinicRecord:
      type: object
      additionalProperties: true
    ClinicRecordList:
      type: array
      items:
        $ref: "#/components/schemas/ClinicRecord"
    ClinicRecordInput:
      type: object
      additionalProperties: true
    PatientInviteInput:
      type: object
      required: [clientId, email]
      properties:
        clientId:
          type: string
        email:
          type: string
    PatientInvite:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    ClinicBookingInput:
      type: object
      required: [slotId]
      properties:
        slotId:
          type: string
    ClinicBooking:
      type: object
      required: [appointment, slot]
      properties:
        appointment:
          $ref: "#/components/schemas/ClinicRecord"
        slot:
          $ref: "#/components/schemas/ClinicRecord"
    AppointmentMediaInput:
      type: object
      required: [objectPath]
      properties:
        objectPath:
          type: string
        mediaType:
          type: string
        caption:
          type: string

